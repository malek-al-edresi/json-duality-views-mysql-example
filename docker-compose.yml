
services:
  mysql:
    image: mysql:9.7
    container_name: mysql-duality-support
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: support_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./views.sql:/docker-entrypoint-initdb.d/03-views.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
